<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Japanese 練習器</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f6; padding: 20px; color: #31333f; }
        .stApp { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .stButton { 
            width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; 
            border-radius: 5px; background: white; cursor: pointer; text-align: left;
        }
        .stButton.active { background-color: #ff4b4b; color: white; border: none; }
        .current-box { background-color: #f8f9fb; border: 1px solid #dfe1e6; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: center; }
        .btn-action { width: 48%; padding: 12px; background-color: #0e1117; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="stApp">
    <h2>🎯 選擇練習課目</h2>
    <div id="status" style="font-size: 14px; color: #ff4b4b; font-weight: bold;">檢查檔案中...</div>
    <div id="sentence-list"></div>
    <div id="practice-zone" style="display:none;">
        <div class="current-box">
            <div id="display-jp" style="font-size: 24px; font-weight: bold;"></div>
            <div id="display-tw" style="color: #666; margin-top:10px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <button class="btn-action" onclick="playCurrent()">🔈 重複聽這句</button>
            <button class="btn-action" onclick="nextStep()">⏭️ 下一句</button>
        </div>
    </div>
    <audio id="audioPlayer"></audio>
</div>

<script>
    let sentences = [];
    let currentIndex = 0;
    const audio = document.getElementById('audioPlayer');

    // 自動偵測正確的路徑
    async function loadData() {
        const paths = ['./assets/lesson.json', './lesson.json', 'lesson.json'];
        for (let path of paths) {
            try {
                const res = await fetch(path);
                if (res.ok) {
                    const data = await res.json();
                    sentences = data.content;
                    // 同步設定音檔路徑 (假設音檔跟 JSON 在同一個資料夾)
                    audio.src = path.replace('lesson.json', 'lesson.mp3');
                    document.getElementById('status').innerText = "✅ 載入成功";
                    document.getElementById('status').style.color = "#666";
                    updateDisplay(0, false);
                    return;
                }
            } catch (e) {}
        }
        document.getElementById('status').innerText = "❌ 找不到教材 (請確認 assets 資料夾內是否有檔案)";
    }

    function updateDisplay(index, autoPlay = true) {
        currentIndex = index;
        const s = sentences[currentIndex];
        document.getElementById('practice-zone').style.display = 'block';
        document.getElementById('display-jp').innerText = s.text;
        document.getElementById('display-tw').innerText = s.translation;
        
        // 更新列表樣式
        const listDiv = document.getElementById('sentence-list');
        listDiv.innerHTML = sentences.map((item, i) => `
            <button class="stButton ${i === currentIndex ? 'active' : ''}" onclick="updateDisplay(${i})">
                ${item.text}
            </button>
        `).join('');

        if (autoPlay) playCurrent();
    }

    function playCurrent() {
        const s = sentences[currentIndex];
        const nextS = sentences[currentIndex + 1];
        audio.currentTime = s.start;
        audio.play();
        const stopTime = nextS ? nextS.start : 9999;
        const check = () => {
            if (audio.currentTime >= stopTime) {
                audio.pause();
                audio.removeEventListener('timeupdate', check);
            }
        };
        audio.addEventListener('timeupdate', check);
    }

    function nextStep() {
        currentIndex = (currentIndex + 1) % sentences.length;
        updateDisplay(currentIndex);
    }

    loadData();
</script>
</body>
</html>
