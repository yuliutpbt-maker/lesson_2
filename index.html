<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文學習閱讀器 - 修復版</title>
    <style>
        body { font-family: sans-serif; line-height: 1.8; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f4f7; }
        #player-container { position: sticky; top: 0; background: #f4f4f7; padding: 20px 0; border-bottom: 2px solid #ddd; z-index: 100; text-align: center; }
        audio { width: 100%; }
        .sentence-item { padding: 15px; margin: 10px 0; border-radius: 8px; background: white; border: 1px solid #ddd; cursor: pointer; }
        .sentence-item.active { background-color: #007bff; color: white; border-color: #0056b3; }
        .jp-text { font-size: 1.3rem; display: block; }
    </style>
</head>
<body>

    <h1>📖 日文教材閱讀器</h1>

    <div id="player-container">
        <audio id="audio-player" controls src="lesson.mp3"></audio>
    </div>

    <div id="content">讀取中...</div>

    <script>
        const audio = document.getElementById('audio-player');
        const contentDiv = document.getElementById('content');
        let lessonData = [];

        fetch('lesson.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(rawData => {
                // 【核心修復】自動判斷資料在哪裡
                if (Array.isArray(rawData)) {
                    lessonData = rawData;
                } else {
                    // 如果不是列表，試著找找看裡面有沒有任何一個欄位是列表
                    const possibleList = Object.values(rawData).find(val => Array.isArray(val));
                    if (possibleList) {
                        lessonData = possibleList;
                    } else {
                        throw new Error("JSON 格式不正確，找不到列表資料。");
                    }
                }

                render(lessonData);
            })
            .catch(err => {
                contentDiv.innerHTML = `<div style="color:red; padding:20px; background:#fff;">❌ 錯誤：${err.message}<br>請檢查 lesson.json 格式是否正確。</div>`;
            });

        function render(data) {
            contentDiv.innerHTML = data.map((item, index) => `
                <div class="sentence-item" id="sentence-${index}" onclick="audio.currentTime=${item.start};audio.play();">
                    <span class="jp-text">${item.text || "文字欄位缺失"}</span>
                </div>
            `).join('');
        }

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            lessonData.forEach((item, index) => {
                const nextItem = lessonData[index + 1];
                const isCurrent = currentTime >= item.start && (!nextItem || currentTime < nextItem.start);
                const element = document.getElementById(`sentence-${index}`);
                if (element) {
                    if (isCurrent) {
                        element.classList.add('active');
                        // 避免頻繁捲動，只有切換句子時才動
                        if (audio.paused === false) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        element.classList.remove('active');
                    }
                }
            });
        });
    </script>
</body>
</html>
